name: docker-publish

# Publishes three images to ghcr.io:
#   - ghcr.io/nyavana/palimpsest-api      (FastAPI backend; worker reuses this)
#   - ghcr.io/nyavana/palimpsest-web      (React SPA + nginx)
#   - ghcr.io/nyavana/palimpsest-postgres (postgis + pgvector + baked migrations)
#
# Triggers:
#   - push to main             -> tags: latest, sha-<short>
#   - push of tag matching v*  -> tags: v0.1.0, 0.1.0, 0.1, latest
#   - pull_request to main     -> tags: pr-<N>  (verification, doesn't move latest)
#   - workflow_dispatch        -> manual rebuild (tagged sha-<short>)
#
# Auth uses the built-in GITHUB_TOKEN (no PAT, no repo secret). The first
# successful run lands packages in the repo's "Packages" sidebar; flip them to
# public via the ghcr UI once if you want anonymous pulls.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: apps/api/Dockerfile
            build-args: ""
          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
            build-args: |
              VITE_API_BASE_URL=/api
              VITE_MAP_ENGINE=maplibre
              VITE_GOOGLE_MAP_TILES_API_KEY=
          - name: postgres
            context: .
            dockerfile: docker/postgres/Dockerfile
            build-args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/palimpsest-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=palimpsest-${{ matrix.name }}
          cache-to: type=gha,scope=palimpsest-${{ matrix.name }},mode=max
