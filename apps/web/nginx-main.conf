# Main nginx config for the production image.
#
# Differs from the upstream nginx:1.27-alpine default in two places:
#   - No `user` directive (we run the whole process as the nginx user
#     via Dockerfile USER, so master + workers share that uid)
#   - `pid /tmp/nginx.pid` instead of /var/run/nginx.pid, because the
#     compose file mounts the rootfs read-only and /tmp is tmpfs.

worker_processes auto;
error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
