# Main nginx config for the production image.
#
# Differs from the upstream nginx:1.27-alpine default in:
#   - No `user` directive (we run the whole process as the nginx user
#     via Dockerfile USER, so master + workers share that uid)
#   - pid and every *_temp_path under /tmp, because the compose file
#     mounts the rootfs read-only. /tmp is the single writable tmpfs;
#     /var/cache/nginx is left alone (read-only, image-baked).

worker_processes auto;
error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Override the compile-time temp paths (defaults live under
    # /var/cache/nginx, which is read-only at runtime). Putting them in
    # /tmp avoids needing a separately-owned tmpfs mount.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
