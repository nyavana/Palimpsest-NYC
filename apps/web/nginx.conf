server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS at 127.0.0.11 — re-resolve the `api` upstream every
    # 10s so a recreated api container is picked up without restarting web.
    # Without this, nginx caches the upstream IP at boot and dials the dead
    # address after `docker compose up -d --force-recreate api`, returning 502.
    # Using a variable in proxy_pass forces re-resolution against the resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;

    # SPA fallback — any unknown route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /agent/ask streams Server-Sent Events. Disable proxy buffering and
    # crank the read timeout so chunks flow straight to the browser instead
    # of being held until the response completes.
    location /api/agent/ask {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;
    }

    # Proxy API calls to the backend service on the docker network
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Long-lived asset caching
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|webp)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}
