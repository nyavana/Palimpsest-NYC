# Palimpsest NYC — local development stack
#
# Brings up: postgres (postgis + pgvector + pg_trgm), redis, api, worker, web.
# V1 is online-only — every LLM call terminates at OpenRouter (see .env), so
# no host-gateway escape hatch is required.

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: palimpsest/postgres:16-postgis-pgvector
    container_name: palimpsest-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # V1 single migration surface — postgres entrypoint applies *.sql in lex
      # order on first volume init. Schema changes require `make nuke && make up`.
      - ./apps/api/app/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: palimpsest-redis
    command:
      - redis-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "60"
      - "1"
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: palimpsest/api:dev
    container_name: palimpsest-api
    env_file: .env
    environment:
      HF_HOME: /cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/tests:/app/tests
      - ./logs:/app/logs
      - ./data:/app/data
      - hf-cache:/cache/huggingface
    ports:
      - "8000:8000"
    command:
      - /opt/venv/bin/uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: palimpsest/api:dev
    container_name: palimpsest-worker
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/worker/worker:/app/worker
      - ./logs:/app/logs
    command:
      - /opt/venv/bin/python
      - -m
      - worker.main
    healthcheck:
      disable: true
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_MAP_ENGINE: ${VITE_MAP_ENGINE}
    image: palimpsest/web:dev
    container_name: palimpsest-web
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  # ── OSRM routing backend ─────────────────────────────────────────────
  #
  # osrm-prepare: one-shot init container that preprocesses the OSM extract
  # into the MLD routing graph. Idempotent — exits 0 immediately if the
  # final output file (extract.osrm.cnbg) is already present on the volume.
  #
  # osrm: runtime routing server. Starts only after osrm-prepare exits 0.
  # Serves on port 5000; the api container uses OSRM_BASE_URL=http://osrm:5000.
  #
  # Both services share the osrm-data named volume. osrm-prepare writes to it;
  # osrm mounts it read-only at runtime.
  #
  # Prerequisites: infra/osrm/extract.osm.pbf must exist (see infra/osrm/README.md
  # and `make extract`). The file is gitignored — drop it in place before `make up`.

  osrm-prepare:
    image: osrm/osrm-backend:v5.25.0
    container_name: palimpsest-osrm-prepare
    command:
      - bash
      - -c
      - |
        if [ -f /data/extract.osrm.cnbg ]; then
          echo "OSRM data already prepared — skipping preprocessing."
          exit 0
        fi
        echo "Running osrm-extract with foot profile..."
        osrm-extract -p /opt/foot.lua /data/extract.osm.pbf
        echo "Running osrm-partition..."
        osrm-partition /data/extract.osrm
        echo "Running osrm-customize..."
        osrm-customize /data/extract.osrm
        echo "OSRM preprocessing complete."
    volumes:
      - ./infra/osrm/extract.osm.pbf:/data/extract.osm.pbf:ro
      - osrm-data:/data
    restart: "no"

  osrm:
    image: osrm/osrm-backend:v5.25.0
    container_name: palimpsest-osrm
    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/extract.osrm
    volumes:
      - osrm-data:/data:ro
    # The api container reaches OSRM over the compose network at
    # http://osrm:5000, so we do not need to publish this port on the
    # host. Leaving it unbound avoids collisions with local macOS services
    # that often claim :5000.
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
    name: palimpsest-postgres-data
  redis-data:
    name: palimpsest-redis-data
  hf-cache:
    name: palimpsest-hf-cache
  osrm-data:
    name: palimpsest-osrm-data

networks:
  default:
    name: palimpsest-net
