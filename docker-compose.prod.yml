# Palimpsest NYC — production compose (pull-only, no local build).
#
# Usage:
#   cp .env.example .env  # set OPENROUTER_API_KEY
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec api python -m app.ingest.cli osm run
#   docker compose -f docker-compose.prod.yml exec api python -m app.ingest.cli wikipedia run
#   open http://localhost:5173
#
# Pin a specific release with PALIMPSEST_TAG, e.g.:
#   PALIMPSEST_TAG=v0.1.0 docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: ghcr.io/nyavana/palimpsest-postgres:${PALIMPSEST_TAG:-latest}
    container_name: palimpsest-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: palimpsest-redis
    command:
      - redis-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "60"
      - "1"
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: ghcr.io/nyavana/palimpsest-api:${PALIMPSEST_TAG:-latest}
    container_name: palimpsest-api
    env_file: .env
    environment:
      HF_HOME: /cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - hf-cache:/cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    command:
      - /opt/venv/bin/uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    restart: unless-stopped

  worker:
    image: ghcr.io/nyavana/palimpsest-api:${PALIMPSEST_TAG:-latest}
    container_name: palimpsest-worker
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    command:
      - /opt/venv/bin/python
      - -m
      - worker.main
    restart: unless-stopped

  web:
    image: ghcr.io/nyavana/palimpsest-web:${PALIMPSEST_TAG:-latest}
    container_name: palimpsest-web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
    name: palimpsest-postgres-data
  redis-data:
    name: palimpsest-redis-data
  hf-cache:
    name: palimpsest-hf-cache

networks:
  default:
    name: palimpsest-net
