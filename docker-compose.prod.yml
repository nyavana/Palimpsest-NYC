# Palimpsest NYC — production compose (pull-only, no local build).
#
# Hardening applied to every service in this file:
#   - cap_drop:[ALL] + minimal cap_add
#   - security_opt: no-new-privileges
#   - read_only rootfs + per-service tmpfs
#   - mem_limit / pids_limit (budgets sum to ~2 GB; host has 2.5 GB)
#   - logging: json-file, 10 MB × 3 files
# Internal services (postgres, redis, api, osrm) do not publish ports;
# they are reachable only over the palimpsest-net bridge by DNS name.
# Only the web service publishes a loopback port for Caddy to reach.
#
# Usage:
#   cp .env.prod.example .env  # fill in OPENROUTER_API_KEY, POSTGRES_PASSWORD, etc.
#   chmod 600 .env
#   docker login ghcr.io       # one-time, PAT with read:packages
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec api python -m app.ingest.cli osm run
#   docker compose -f docker-compose.prod.yml exec api python -m app.ingest.cli wikipedia run
#
# Pin a release with PALIMPSEST_TAG, e.g.:
#   PALIMPSEST_TAG=0.1.0 docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: ghcr.io/nyavana/palimpsest-postgres:${PALIMPSEST_TAG:-0.1.0}
    container_name: palimpsest-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 700m
    mem_reservation: 500m
    pids_limit: 512
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: palimpsest-redis
    command:
      - redis-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "60"
      - "1"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 220m
    mem_reservation: 200m
    pids_limit: 200
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ghcr.io/nyavana/palimpsest-api:${PALIMPSEST_TAG:-0.1.0}
    container_name: palimpsest-api
    env_file: .env
    environment:
      HF_HOME: /cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - hf-cache:/cache/huggingface
    command:
      - /opt/venv/bin/uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    restart: unless-stopped
    mem_limit: 600m
    mem_reservation: 400m
    pids_limit: 512
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ghcr.io/nyavana/palimpsest-api:${PALIMPSEST_TAG:-0.1.0}
    container_name: palimpsest-worker
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    command:
      - /opt/venv/bin/python
      - -m
      - worker.main
    restart: unless-stopped
    mem_limit: 350m
    mem_reservation: 200m
    pids_limit: 512
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/nyavana/palimpsest-web:${PALIMPSEST_TAG:-0.1.0}
    container_name: palimpsest-web
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      - api
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 32m
    pids_limit: 100
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── OSRM routing backend ─────────────────────────────────────────────
  #
  # osrm-prepare: one-shot init container that preprocesses the OSM extract
  # into the MLD routing graph. Idempotent — exits 0 immediately if the
  # final output file (extract.osrm.cnbg) is already present on the volume.
  #
  # osrm: runtime routing server. Starts only after osrm-prepare exits 0.
  # The api container reaches OSRM over the compose network at
  # http://osrm:5000, so we do not publish this port.
  #
  # Pinned at v5.25.0. The upstream `osrm/osrm-backend` Docker Hub repo
  # has not published a tag since v5.25.0 (2021-05-17), so there is no
  # public image newer than that. Building our own image from the
  # upstream Dockerfile + a newer source release is tracked as a
  # follow-up; until then we stay on the same tag the dev compose uses,
  # which keeps the osrm-data volume re-usable across the cutover.

  osrm-prepare:
    image: osrm/osrm-backend:v5.25.0
    container_name: palimpsest-osrm-prepare
    command:
      - bash
      - -c
      - |
        if [ -f /data/extract.osrm.cnbg ]; then
          echo "OSRM data already prepared — skipping preprocessing."
          exit 0
        fi
        echo "Running osrm-extract with foot profile..."
        osrm-extract -p /opt/foot.lua /data/extract.osm.pbf
        echo "Running osrm-partition..."
        osrm-partition /data/extract.osrm
        echo "Running osrm-customize..."
        osrm-customize /data/extract.osrm
        echo "OSRM preprocessing complete."
    volumes:
      - ./infra/osrm/extract.osm.pbf:/data/extract.osm.pbf:ro
      - osrm-data:/data
    restart: "no"
    mem_limit: 600m
    pids_limit: 200
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  osrm:
    image: osrm/osrm-backend:v5.25.0
    container_name: palimpsest-osrm
    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/extract.osrm
    volumes:
      - osrm-data:/data:ro
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 200m
    mem_reservation: 100m
    pids_limit: 200
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    name: palimpsest-postgres-data
  redis-data:
    name: palimpsest-redis-data
  hf-cache:
    name: palimpsest-hf-cache
  osrm-data:
    name: palimpsest-osrm-data

networks:
  default:
    name: palimpsest-net
